services:
  backend:
    build: ./backend
    container_name: backend
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "9000"
    networks:
      - back-db
      - front-back
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "9001"
    env_file:
      - .env-front
    networks:
      - nginx-front
      - front-back
    depends_on:
      backend:
        condition: service_healthy
  database:
    image: postgres:15
    container_name: database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    ports:
      - "5432"
    networks:
      - back-db
    volumes:
      - db_data:/var/lib/postgresql/data
  nginx:
    image: nginx:latest
    container_name: nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "80:80"  
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nginx-front

    depends_on:
      frontend:
        condition: service_healthy

volumes:
  db_data:

networks:
  front-back:
  back-db:
  nginx-front: