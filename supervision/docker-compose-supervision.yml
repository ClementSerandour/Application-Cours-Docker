version: "3.9"

services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"   # interface web cAdvisor
    volumes:
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      monitoring:
        ipv4_address: 172.30.0.2
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      monitoring:
        ipv4_address: 172.30.0.3
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"    # interface web Grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin   # mot de passe admin par défaut
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana   # persistance des dashboards et datasources
    networks:
      monitoring:
        ipv4_address: 172.30.0.4
    depends_on:
      - prometheus
    restart: always

volumes:
  grafana_data:

networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
